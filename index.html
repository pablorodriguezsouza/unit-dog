<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dog</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand">🐶 Dog</span>
      </div>
    </nav>
    <div class="container mt-4">
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title" id="description"></h5>
          <p class="card-text text-muted" id="info"></p>
        </div>
      </div>
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button class="btn btn-dark" id="bark">Ladrar</button>
        <button class="btn btn-dark" id="sleep">Dormir</button>
        <button class="btn btn-dark" id="wake-up">Despertar</button>
      </div>
      <div class="input-group mb-3">
        <input class="form-control" id="trick" placeholder="Truco" />
        <button class="btn btn-outline-dark" id="learn-trick">
          Enseñar truco
        </button>
      </div>
      <ul class="list-group" id="messages"></ul>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
